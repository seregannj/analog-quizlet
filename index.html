<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<title>Лексио — тренажёр слов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2358CC02'/%3E%3Ccircle cx='11' cy='15' r='5' fill='%23fff'/%3E%3Ccircle cx='21' cy='15' r='5' fill='%23fff'/%3E%3Ccircle cx='11' cy='15' r='2' fill='%233C3C3C'/%3E%3Ccircle cx='21' cy='15' r='2' fill='%233C3C3C'/%3E%3Cpath d='M13 22l3 3 3-3z' fill='%23FFC800'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>

<aside class="rail">
  <div class="logo"><span class="logo-badge"><svg width="26" height="26"><use href="#i-owl"/></svg></span><span>Лексио</span></div>
  <a href="#/home" data-nav="home"><svg width="22" height="22"><use href="#i-home"/></svg>Главная</a>
  <a href="#/decks" data-nav="decks"><svg width="22" height="22"><use href="#i-books"/></svg>Словари</a>
  <a href="#/train" data-nav="train"><svg width="22" height="22"><use href="#i-bolt"/></svg>Урок</a>
  <a href="#/stats" data-nav="stats"><svg width="22" height="22"><use href="#i-chart"/></svg>Прогресс</a>
  <a href="#/settings" data-nav="settings"><svg width="22" height="22"><use href="#i-sliders"/></svg>Настройки</a>
</aside>

<div class="shell">
  <header class="topbar">
    <span class="pill pill-red"><svg width="20" height="20"><use href="#i-fire"/></svg><b id="pStreak">0</b></span>
    <span class="pill pill-gold"><svg width="20" height="20"><use href="#i-bolt"/></svg><b id="pXp">0</b></span>
    <span class="pill pill-blue"><svg width="20" height="20"><use href="#i-gem"/></svg><b id="pGems">0</b></span>
  </header>
  <main id="app" class="page"></main>
</div>

<nav class="tabbar">
  <button data-nav="home" onclick="location.hash='#/home'"><span class="ico"><svg width="22" height="22"><use href="#i-home"/></svg></span>Главная</button>
  <button data-nav="decks" onclick="location.hash='#/decks'"><span class="ico"><svg width="22" height="22"><use href="#i-books"/></svg></span>Словари</button>
  <button data-nav="train" onclick="location.hash='#/train'"><span class="ico"><svg width="22" height="22"><use href="#i-bolt"/></svg></span>Урок</button>
  <button data-nav="stats" onclick="location.hash='#/stats'"><span class="ico"><svg width="22" height="22"><use href="#i-chart"/></svg></span>Прогресс</button>
  <button data-nav="settings" onclick="location.hash='#/settings'"><span class="ico"><svg width="22" height="22"><use href="#i-sliders"/></svg></span>Ещё</button>
</nav>

<div class="feedback" id="fb">
  <div class="fb-icon"><svg width="30" height="30"><use id="fbUse" href="#i-check"/></svg></div>
  <div class="fb-text"><div class="fb-title" id="fbTitle"></div><div class="fb-sub" id="fbSub"></div></div>
  <button class="fb-btn" id="fbBtn">Продолжить</button>
</div>

<div class="toast" id="toast"></div>
<div class="overlay hide" id="overlay"><div class="modal-card" id="modalBox"></div></div>

<script src="src/core/icons.js"></script>
<script src="src/core/util.js"></script>
<script src="src/core/zip.js"></script>
<script src="src/core/sm2.js"></script>
<script src="src/core/store.js"></script>
<script src="src/core/router.js"></script>
<script src="src/views/onboarding.js"></script>
<script src="src/views/home.js"></script>
<script src="src/views/decks.js"></script>
<script src="src/views/words.js"></script>
<script src="src/views/train.js"></script>
<script src="src/views/stats.js"></script>
<script src="src/views/settings.js"></script>
<script src="src/main.js"></script>
</body>
</html>
